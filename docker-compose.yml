services:
  postgres:
    image: postgres:17-alpine
    container_name: talkie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talkie
      POSTGRES_PASSWORD: talkie
      POSTGRES_DB: talkie
    ports:
      - "5432:5432"
    volumes:
      - talkie-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkie -d talkie"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  talkie-pgdata:
